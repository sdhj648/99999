name: Build Android APK

# 触发条件：推送到 main/master 分支，或手动在 Actions 页面点击 Run workflow
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # 可选 Release 签名（仓库 Secrets 未配置时为空字符串，自动回退 debug 签名）
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build-apk:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components (platform 36 + build tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/variables.gradle', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Capacitor sync (copy web assets + config to android)
        run: npx cap sync android

      # assembleDebug 会同时自动生成 ~/.android/debug.keystore，
      # 供后续 release 回退签名使用（也保证 debug APK 可安装）
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 配置了 KEYSTORE_BASE64 等 Secrets 时才使用正式签名，否则用 debug 证书兜底
      - name: Configure release signing (optional)
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
